[tool.poetry]
name = "trading-dashboard-server"
version = "0.1.0"
description = "FastAPI backend for the trading dashboard"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic-settings = "^2.2.1"
sqlalchemy = {version = "^2.0.23", extras = ["asyncio"]}
asyncpg = "^0.28.0"
alembic = "^1.12.1"
httpx = "^0.25.2"
redis = "^5.0.1"
pydantic = "^2.5.3"
structlog = "^24.1.0"
orjson = "^3.9.10"
sse-starlette = "^1.6.1"
pandas = "^2.1.4"
numpy = "^1.26.2"
ta = "^0.10.2"
python-dateutil = "^2.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.2"
httpx = "^0.25.2"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
ruff = "^0.0.292"
types-redis = "^4.6.0.7"
types-python-dateutil = "^2.8.19.14"

[tool.poetry.scripts]
trading-dashboard-server = "app.main:app"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
plugins = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
known_first_party = ["app"]
